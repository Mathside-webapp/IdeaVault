name: Build IdeaVault Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # GitHub's Ubuntu runners already contain the Android SDK.
      # Avoid setup-android@v3, whose older cmdline-tools download/license
      # stage failed on the user's hosted runner before the app was built.
      - name: Configure the preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "SDK root: $SDK_ROOT"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found at $SDKMANAGER"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          if [ ! -d "$SDK_ROOT/platforms/android-36" ] || [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          else
            echo "Android API 36 and Build Tools 36.0.0 are already installed."
          fi

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Verify core unit tests
        run: npm test

      - name: Build offline web assets
        run: npm run build

      - name: Generate Capacitor Android platform
        run: npx cap add android

      - name: Add IdeaVault Android icons and permissions
        run: python3 tools/patch_android.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IdeaVault-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
